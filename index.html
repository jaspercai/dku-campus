<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>DKU Campus and Surroundings - Interactive Map</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<style>
  html, body { margin:0; padding:0; height:100%; }
  #map { width:100%; height:100%; background:#111; }

  /* Modal */
  .modal-overlay {
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,0.6);
    display: none;
    align-items: center;
    justify-content: center;
    z-index: 9999;
  }

  .modal {
    background: #fff;
    border-radius: 12px;
    overflow: hidden;
    width: 40vw;
    max-height: 85vh;
    display: flex;
    flex-direction: column;
  }

  @media (max-width: 768px) {
    .modal { width: 90vw; }
  }

  .modal-header {
    padding: 12px 16px;
    font-size: 18px;
    font-weight: bold;
    border-bottom: 1px solid #ddd;
  }

  .modal-body {
    padding: 12px;
    overflow-y: auto;
  }

  /* 4:3 image box */
  .image-box {
    position: relative;
    width: 100%;
    aspect-ratio: 4 / 3;
    overflow: hidden;
    background: #000;
    display: flex;
    align-items: center;
    justify-content: center;
  }

  .image-box img {
    width: 100%;
    height: 100%;
    object-fit: cover;
  }

  .arrow {
    position: absolute;
    top: 50%;
    transform: translateY(-50%);
    background: rgba(0,0,0,0.5);
    color: #fff;
    border: none;
    font-size: 18px;
    padding: 8px 10px;
    cursor: pointer;
    z-index: 2;
  }

  .arrow.left { left: 8px; }
  .arrow.right { right: 8px; }

  .desc {
    margin-top: 10px;
    font-size: 14px;
    line-height: 1.4;
  }

  .close-btn {
    position: absolute;
    top: 10px;
    right: 10px;
    background: transparent;
    border: none;
    font-size: 18px;
    cursor: pointer;
  }
</style>
</head>
<body>
<div id="map"></div>

<div class="modal-overlay" id="modalOverlay">
  <div class="modal">
    <button class="close-btn" onclick="closeModal()" aria-label="Close popup">✕</button>
    <div class="modal-header" id="modalTitle"></div>
    <div class="modal-body">
      <div class="image-box">
        <button class="arrow left" onclick="prevImage()">‹</button>
        <img id="modalImage" src="" />
        <button class="arrow right" onclick="nextImage()">›</button>
      </div>
      <div class="desc" id="modalDesc"></div>
    </div>
  </div>
</div>

<script>

// ===== MAP SETUP =====
const imageWidth = 9701;
const imageHeight = 5000;
const bounds = [[0,0],[imageHeight,imageWidth]];

const map = L.map('map', {
  crs: L.CRS.Simple,
  minZoom: -2,
  maxZoom: 2,
  maxBounds: bounds,
  maxBoundsViscosity: 1.0
});

L.imageOverlay('map.jpg', bounds).addTo(map);
map.fitBounds(bounds);

  // Sample markers data
  const markersData = [
    {
      title: "Innovation Building",
      coords: [1364, 4256],
      images: ["IB.jpg"],
      desc: "Opened in 2019, the Innovation Building sits on the south bank of the campus pond. It features office space in its west wing and laboratories for science and other disciplines on its east side. The neighboring pond is not only an ecosystem in itself but also acts as a sponge system facilitating the reuse of rainwater. Areas populated with cherry trees provide a versatile space for contemplation, relaxation and socializing, evoking the iconic cherry blossoms at Wuhan University."
    },
    {
      title: "Zhouzhuang (周庄)",
      coords: [4620, 1700],
      images: ["zhouzhuang1.png", "zhouzhuang2.png"],
      desc: "Zhouzhuang is one of China’s most famous water towns, known for its well-preserved Ming and Qing dynasty architecture. Stone bridges arch gracefully over narrow canals, and traditional houses line the waterways, offering visitors a glimpse into life in ancient Jiangnan. A boat ride here feels like stepping into a living painting."
    }
  ];

  let currentImages = [];
  let currentIndex = 0;

  markersData.forEach(item => {
    const marker = L.marker(item.coords).addTo(map);
    marker.on('click', () => openModal(item));
  });

  function openModal(item) {
    currentImages = item.images;
    currentIndex = 0;
    const showArrows = currentImages.length > 1;
    document.querySelector('.arrow.left').style.display = showArrows ? 'block' : 'none';
    document.querySelector('.arrow.right').style.display = showArrows ? 'block' : 'none';

    document.getElementById('modalTitle').textContent = item.title;
    document.getElementById('modalDesc').textContent = item.desc;

    updateImage();
    document.getElementById('modalOverlay').style.display = 'flex';
  }

  function closeModal() {
    document.getElementById('modalOverlay').style.display = 'none';
  }

  function updateImage() {
    document.getElementById('modalImage').src = currentImages[currentIndex];
  }

  function nextImage() {
    if (currentImages.length > 0) {
      currentIndex = (currentIndex + 1) % currentImages.length;
      updateImage();
    }
  }

  function prevImage() {
    if (currentImages.length > 0) {
      currentIndex = (currentIndex - 1 + currentImages.length) % currentImages.length;
      updateImage();
    }
  }

  // Close modal on background click
  document.getElementById('modalOverlay').addEventListener('click', function(e) {
    if (e.target === this) closeModal();
  });

  // ===== CLICK DEBUG =====
  map.on('click', e => {
    console.log(e.latlng);
  });
</script>
</body>
</html>
