<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>DKU Campus and Surroundings - Interactive Map</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<style>
  html, body { margin:0; padding:0; height:100%; }
  #map { width:100%; height:100%; background:#111; }

  /* Modal */
  .modal-overlay {
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,0.6);
    display: none;
    align-items: center;
    justify-content: center;
    z-index: 9999;
  }

  .modal {
    background: #fff;
    border-radius: 12px;
    overflow: hidden;
    width: 40vw;
    max-height: 85vh;
    display: flex;
    flex-direction: column;
  }

  @media (max-width: 768px) {
    .modal { width: 90vw; }
  }

  .modal-header {
    padding: 12px 16px;
    font-size: 18px;
    font-weight: bold;
    border-bottom: 1px solid #ddd;
  }

  .modal-body {
    padding: 12px;
    overflow-y: auto;
  }

  /* 4:3 image box */
  .image-box {
    position: relative;
    width: 100%;
    aspect-ratio: 4 / 3;
    overflow: hidden;
    background: #000;
    display: flex;
    align-items: center;
    justify-content: center;
  }

  .image-box img {
    width: 100%;
    height: 100%;
    object-fit: cover;
  }

  .arrow {
    position: absolute;
    top: 50%;
    transform: translateY(-50%);
    background: rgba(0,0,0,0.5);
    color: #fff;
    border: none;
    font-size: 18px;
    padding: 8px 10px;
    cursor: pointer;
    z-index: 2;
  }

  .arrow.left { left: 8px; }
  .arrow.right { right: 8px; }

  .desc {
    margin-top: 10px;
    font-size: 14px;
    line-height: 1.4;

  }

  .close-btn {
    position: absolute;
    top: 10px;
    right: 10px;
    background: transparent;
    border: none;
    font-size: 18px;
    cursor: pointer;
  }
</style>
</head>
<body>
<div id="map"></div>

<div class="modal-overlay" id="modalOverlay">
  <div class="modal">
    <button class="close-btn" onclick="closeModal()" aria-label="Close popup">✕</button>
    <div class="modal-header" id="modalTitle"></div>
    <div class="modal-body">
      <div class="image-box">
        <button class="arrow left" onclick="prevImage()">‹</button>
        <img id="modalImage" src="" />
        <button class="arrow right" onclick="nextImage()">›</button>
      </div>
      <div class="desc" id="modalDesc"></div>
    </div>
  </div>
</div>

  minZoom: -2.5,
  maxZoom: 2,
  maxBounds: bounds,
  maxBoundsViscosity: 1.0,
});
map.attributionControl.setPrefix('DKU Interactive Map');

L.imageOverlay('map.jpg', bounds).addTo(map);
map.fitBounds(bounds);

pen to all members of the DKU community. Each student is eligible for one complimentary consultation session per month. Trainers are internationally certified and provide bilingual instruction in both English and Chinese. Each session includes an InBody body composition analysis and consultation, followed by approximately 45 minutes of guided training and 15 minutes of recovery, including stretching, massage, and foam rolling. Additional services such as sports massage and wellness consultations are also available. \\n\\nA front desk provides information and support, including equipment checkout services, while Campus Recreation offers day passes for visitors. Through its combination of state-of-the-art facilities, professional services, and accessible programming, the Sports Complex serves as a central space for physical activity, stress relief, and community engagement at DKU."

 choices."

  let currentImages = [];
  let currentIndex = 0;

  markersData.forEach(item => {
    const marker = L.marker(item.coords).addTo(map);
    marker.on('click', () => openModal(item));
  });

  function openModal(item) {
    currentImages = item.images;
    currentIndex = 0;
    const showArrows = currentImages.length > 1;
    document.querySelector('.arrow.left').style.display = showArrows ? 'block' : 'none';
    document.querySelector('.arrow.right').style.display = showArrows ? 'block' : 'none';

    document.getElementById('modalTitle').textContent = item.title;
    document.getElementById('modalDesc').innerHTML = item.desc.replace(/\\n/g, '<br>');

    updateImage();
    document.getElementById('modalOverlay').style.display = 'flex';
  }

  function closeModal() {
    document.getElementById('modalOverlay').style.display = 'none';
  }

  function updateImage() {
    document.getElementById('modalImage').src = currentImages[currentIndex];
  }

  function nextImage() {
    if (currentImages.length > 0) {
      currentIndex = (currentIndex + 1) % currentImages.length;
      updateImage();
    }
  }

  function prevImage() {
    if (currentImages.length > 0) {
      currentIndex = (currentIndex - 1 + currentImages.length) % currentImages.length;
      updateImage();
    }
  }

  // Close modal on background click
  document.getElementById('modalOverlay').addEventListener('click', function(e) {
    if (e.target === this) closeModal();
  });

  // ===== CLICK DEBUG =====
  map.on('click', e => {
    console.log(e.latlng);
  });
</script>
</body>
</html>
